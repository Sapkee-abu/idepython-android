name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk IDEPython-debug.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "IDEPython (buildล่าสุด)"
          body: "อัปเดตอัตโนมัติจาก commit ล่าสุดบน main — โหลด IDEPython-debug.apk แล้วติดตั้งบนแท็บเล็ตได้เลย"
          files: IDEPython-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
